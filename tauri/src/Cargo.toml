[package]
name = "termian"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
build = "rust/build.rs"

# One source tree: Cargo, Tauri config, UI and Rust sources are all under src/.
[lib]
name = "termian"
path = "rust/lib.rs"

[[bin]]
name = "termian"
path = "rust/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
serial2 = "0.2.39"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
rand = "0.8"
url = "2.5.8"
ureq = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
semver = "1"
rand10 = { package = "rand", version = "0.10" }

[dev-dependencies]
minisign-verify = "0.3"

# Faster production builds; SSH/SFTP aren't CPU-bound by application code.
# Rust's default opt-level=3 makes cold CI compilation substantially slower.
[profile.release]
opt-level = 2
codegen-units = 32
lto = false
