name: Android

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'scripts/android-icons.py'
      - 'scripts/build-android.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'scripts/android-icons.py'
      - 'scripts/build-android.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/android/rust
          key: android-ndk-r28c
      - run: env -u ANDROID_NDK_HOME ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termian-android-debug
          path: dist/android/termian-debug.apk
          if-no-files-found: error
          retention-days: 14
