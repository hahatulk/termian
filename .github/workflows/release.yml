name: Release Termian

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cloud-sync-server/**'
      - '.github/workflows/cloud-server.yml'
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'cloud-sync-server/**'
      - '.github/workflows/cloud-server.yml'
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version: X.Y.Z or X.Y.Z-beta.N"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('termian-pr-{0}', github.event.pull_request.number) || 'termian-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      changelog: ${{ steps.release.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: scripts/release
      - run: cargo test --locked --manifest-path scripts/release/Cargo.toml
      - name: Calculate release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: cargo run --locked --manifest-path scripts/release/Cargo.toml -- prepare

  build:
    name: Cargo ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: mac-arm64
            deployment: '11.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment || '' }}
      TERMIAN_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TERMIAN_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: ${{ matrix.platform == 'win-x64' }}
      - name: Test client
        run: cargo test --locked --release --target '${{ matrix.target }}'
      - name: Build client
        run: cargo build --locked --release --target '${{ matrix.target }}' --bin termian-native
      - name: Package Windows EXE and installer
        if: matrix.platform == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $portable = Join-Path $PWD "dist/termian-$env:TERMIAN_RELEASE_VERSION-win-x64.exe"
          $installer = Join-Path $PWD "dist/termian-$env:TERMIAN_RELEASE_VERSION-win-x64-setup.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/termian-native.exe $portable
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          & $nsis "/DBINARY=$portable" "/DOUTPUT=$installer" "/DVERSION=$env:TERMIAN_RELEASE_VERSION" scripts/termian.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and package Apple Silicon app
        if: matrix.platform == 'mac-arm64'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_SIGNING_IDENTITY" && "$APPLE_SIGNING_IDENTITY" != '-' ]]; then
            for secret in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [[ -n "${!secret}" ]] || { echo "::error::Missing $secret for Developer ID signing"; exit 1; }
            done
            scratch="$(mktemp -d)"
            export APPLE_KEYCHAIN="$scratch/termian.keychain-db"
            trap 'if [[ -f "$APPLE_KEYCHAIN" ]]; then security delete-keychain "$APPLE_KEYCHAIN" || true; fi; rm -rf "$scratch"' EXIT
            if ! printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$scratch/cert.p12" || [[ ! -s "$scratch/cert.p12" ]]; then
              echo '::error::APPLE_CERTIFICATE must contain a Base64-encoded PKCS#12 certificate.'
              exit 1
            fi
            keychain_password="$(openssl rand -hex 32)"
            security create-keychain -p "$keychain_password" "$APPLE_KEYCHAIN"
            security set-keychain-settings -lut 21600 "$APPLE_KEYCHAIN"
            security unlock-keychain -p "$keychain_password" "$APPLE_KEYCHAIN"
            security import "$scratch/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -k "$APPLE_KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$APPLE_KEYCHAIN"
          elif [[ -n "$APPLE_CERTIFICATE$APPLE_CERTIFICATE_PASSWORD$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ]]; then
            echo '::error::Set APPLE_SIGNING_IDENTITY for the configured Developer ID credentials.'
            exit 1
          fi
          scripts/package-macos.sh target/aarch64-apple-darwin/release/termian-native dist "$TERMIAN_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: termian-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: dist/termian-*
          if-no-files-found: error
          retention-days: 14

  build_android:
    name: Android ARM64 and x86_64
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: actions/cache@v4
        id: android-sdk
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0
            ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform37-build37-ndk28.2.13676358
      - name: Install Android SDK packages
        if: steps.android-sdk.outputs.cache-hit != 'true'
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/android/rust
          cache-workspace-crates: true
          key: android-ndk-28.2.13676358
      - name: Build Android APK for pull request
        if: github.event_name == 'pull_request'
        run: env -u ANDROID_NDK_HOME ./scripts/build-android.sh
      - name: Build signed Android release APK
        if: github.event_name != 'pull_request'
        env:
          TERMIAN_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TERMIAN_UPDATE_REPOSITORY: ${{ github.repository }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/termian-android.XXXXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE="$keystore"
          export ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          env -u ANDROID_NDK_HOME ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termian-${{ needs.prepare.outputs.version }}-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [prepare, build, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: scripts/release
      - uses: actions/download-artifact@v4
        with:
          pattern: termian-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Sign update packages and write latest.json
        env:
          TERMIAN_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.changelog }}
          TERMIAN_SIGNING_PRIVATE_KEY: ${{ secrets.TERMIAN_SIGNING_PRIVATE_KEY }}
          TERMIAN_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TERMIAN_SIGNING_PRIVATE_KEY_PASSWORD }}
          PREVIOUS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PREVIOUS_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TERMIAN_SIGNING_PRIVATE_KEY" ]]; then
            export TERMIAN_SIGNING_PRIVATE_KEY="$PREVIOUS_SIGNING_KEY"
            export TERMIAN_SIGNING_PRIVATE_KEY_PASSWORD="$PREVIOUS_SIGNING_PASSWORD"
          fi
          cargo run --locked --manifest-path scripts/release/Cargo.toml -- sign release-assets
      - name: Check existing release
        id: release_status
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$status" in
            200) publish=$(jq -r '.draft == true or .prerelease == true' "$body") ;;
            404) publish=true ;;
            *) printf 'Release lookup for %s failed (HTTP %s)\n' "$RELEASE_TAG" "$status" >&2; exit 1 ;;
          esac
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: steps.release_status.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Termian ${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.changelog }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
