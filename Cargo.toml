[package]
name = "termian-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "termian-native"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
crypto_secretbox = "0.1.1"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

