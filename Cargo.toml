[package]
name = "termian-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "termian-native"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
crypto_secretbox = "0.1.1"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
alacritty_terminal = "0.26.0"
portable-pty = "0.9"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
dirs = "7.0.0"
futures = "0.3.34"

